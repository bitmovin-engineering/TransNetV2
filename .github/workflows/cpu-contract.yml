name: CPU worker contract
on:
  pull_request:
    paths: ['inference-cpu/**', 'tools/**', '.github/workflows/cpu-contract.yml']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install './inference-cpu[test]'
      - run: python -m pytest inference-cpu/tests -q
