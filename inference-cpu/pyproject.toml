[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transnetv2-cpu"
version = "0.2.0"
description = "Experimental guarded and single-pass FP32 CPU inference for offline TransNetV2"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
dependencies = ["numpy==2.2.6", "openvino==2025.3.0"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
build-models = ["tensorflow-cpu==2.21.0", "nncf==2.18.0"]

[project.scripts]
transnetv2-cpu = "transnetv2_cpu.worker:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
